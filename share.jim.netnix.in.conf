# vim: syntax=apache ts=4 sw=4 sts=4 sr noet

<Directory /var/www/html/share>
	AllowOverride None
	Options -Indexes
</Directory> 

<VirtualHost *:443>
	ServerName share.jim.netnix.in
	ServerAlias s.jim.netnix.in 
	SSLEngine on
	SSLCertificateFile /etc/letsencrypt/live/jim.netnix.in/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/jim.netnix.in/privkey.pem
	ServerAdmin webmaster@localhost 
	DocumentRoot /var/www/html/share
	ErrorLog ${APACHE_LOG_DIR}/share-error.log
	CustomLog ${APACHE_LOG_DIR}/share-access.log combined

	#DirectoryIndex share.php # wrong, it will remove the parameters
	RewriteEngine On
	#RewriteRule ^$ /share.php [QSA,L]
	RewriteRule ^/$ /share.php [QSA,L] # apparently the right one
	DirectorySlash off

	<FilesMatch "\.(cgi|shtml|phtml|php)$">
		SSLOptions +StdEnvVars
	</FilesMatch>
	<Directory /usr/lib/cgi-bin>
		SSLOptions +StdEnvVars
	</Directory>
	BrowserMatch "MSIE [2-6]" \
			nokeepalive ssl-unclean-shutdown \
			downgrade-1.0 force-response-1.0
	BrowserMatch "MSIE [17-9]" ssl-unclean-shutdown
	<FilesMatch ".+\.ph(?:ar|p|tml)$">
		SetHandler "proxy:unix:/run/php/php8.4-share.sock|fcgi://localhost/"
	</FilesMatch>

LogLevel alert rewrite:trace3
</VirtualHost> 

<VirtualHost *:80> 
	ServerName share.jim.netnix.in
	Redirect 301 / https://share.jim.netnix.in/
</VirtualHost> 

<IfModule mod_headers.c>
	Header always set Strict-Transport-Security "max-age=15552000; includeSubDomains"
</IfModule>


